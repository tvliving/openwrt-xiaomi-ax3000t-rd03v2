name: debug-watchdog-real-rootfs
on: workflow_dispatch
jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox qemu-user-static binutils
          sudo ln -sf "$(command -v qemu-aarch64-static)" /usr/local/bin/qemu-aarch64
      - name: assemble aarch64 rootfs
        run: |
          set -e
          RFS=/tmp/rfs; mkdir -p $RFS
          curl -sSL -o /tmp/alpine.tgz https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.0-aarch64.tar.gz
          tar xzf /tmp/alpine.tgz -C $RFS
          B=https://downloads.openwrt.org/releases/23.05.5/packages/aarch64_cortex-a53/base
          curl -sSL -o /tmp/libgcc.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libgcc-13.2.1_git20240309-r1.apk
          d0=$(mktemp -d); (cd $d0 && tar xzf /tmp/libgcc.apk && cp -a lib/* $RFS/lib/ 2>/dev/null || cp -a usr/lib/* $RFS/usr/lib/ 2>/dev/null || true)
          for p in uci_2023-08-10-5781664d-1_aarch64_cortex-a53.ipk \
                   libuci20130104_2023-08-10-5781664d-1_aarch64_cortex-a53.ipk \
                   jsonfilter_2025-04-18-8a86fb78-1_aarch64_cortex-a53.ipk \
                   libubox20230523_2023-05-23-75a3b870-1_aarch64_cortex-a53.ipk \
                   libblobmsg-json20230523_2023-05-23-75a3b870-1_aarch64_cortex-a53.ipk \
                   libubus20230605_2023-06-05-f787c97b-1_aarch64_cortex-a53.ipk \
                   libjson-c5_0.16-3_aarch64_cortex-a53.ipk; do
            curl -sSL -O "$B/$p"
            d=$(mktemp -d); (cd $d && tar xzf "$OLDPWD/$p" && tar xzf data.tar.gz -C $RFS)
          done
          ls -la $RFS/sbin/uci $RFS/usr/bin/jsonfilter $RFS/lib/ld-musl-aarch64.so.1 $RFS/bin/busybox
          qemu-aarch64 -L $RFS $RFS/sbin/uci -h >/dev/null 2>&1 && echo 'uci runs OK' || echo 'uci FAILED'
          qemu-aarch64 -L $RFS $RFS/usr/bin/jsonfilter 2>&1 | head -2
      - name: run watchdog host tests
        id: tests
        run: |
          bash tools/test-watchdog.sh --env host --rootfs /tmp/rfs 2>&1 | tee /tmp/wd.log
          echo "exit=$?" >> $GITHUB_OUTPUT
      - name: upload failure workdir
        if: failure()
        run: |
          D=$(ls -dt /tmp/test-watchdog.* 2>/dev/null | head -1)
          # rerun one failing scenario with --keep to capture the workdir
          bash tools/test-watchdog.sh --env host --rootfs /tmp/rfs --keep q6_crashed root_crash_running > /tmp/wd2.log 2>&1 || true
          D=$(ls -dt /tmp/test-watchdog.* 2>/dev/null | head -1)
          echo "workdir: $D"
          find "$D" -maxdepth 4 | head -50
          tar czf /tmp/wdwork.tgz "$D"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wd-debug
          path: |
            /tmp/wd.log
            /tmp/wd2.log
            /tmp/wdwork.tgz
